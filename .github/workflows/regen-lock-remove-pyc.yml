steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      persist-credentials: true

  - name: Setup Node 18
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Remove tracked Python bytecode files
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git rm -r --cached "**/*.pyc" || true
      git rm -f main.cpython-313.pyc || true
      git commit -am "chore: remove Python bytecode files" || echo "no changes to commit"
      git push || echo "push failed"

  - name: Regenerate frontend package-lock and build
    run: |
      cd frontend || true
      rm -rf node_modules package-lock.json || true
      npm ci || npm install
      npm run build || true
      git add package-lock.json || true
      git commit -m "chore: regenerate package-lock to match package.json" || echo "no changes to commit"
      git push || echo "push failed"
